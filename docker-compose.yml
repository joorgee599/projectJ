version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_dev_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./vendor:/var/www/html/vendor
      - ./storage:/var/www/html/storage
    environment:
      APP_ENV: development
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: laravel_dev_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: projectJ
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
